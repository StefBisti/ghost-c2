name: CI

on:
    push:
        branches: ["*"]
    pull_request:
    schedule:
      - cron: "0 9 * * 1"

jobs:
    security-and-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                go-version: "1.25.10"


            - name: gosec
              run: go run github.com/securego/gosec/v2/cmd/gosec@latest ./...

            - name: govulncheck
              run: |
                go install golang.org/x/vuln/cmd/govulncheck@latest
                govulncheck ./...
            
            - name: go test
              run: go test ./...

            - name: go build
              run: |
                GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/server
                GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/agent
